<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labor Cost Atlas</title>
  <meta name="description" content="Unit labor costs, productivity, wages and working time across Europe, the Western Balkans and North Africa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Open fallbacks for the TBI typefaces (Aeonik, PP Editorial New), used only where those are not installed -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-row">
      <a class="wordmark" href="#/home"><span class="brand-mark" aria-hidden="true"></span>Labor Cost Atlas</a>
      <div class="theme" id="theme" role="group" aria-label="Color theme">
        <button data-theme="light">Light</button><button data-theme="dark">Dark</button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </header>
  <div class="context" id="context" aria-label="Selection"></div>

  <main id="app" aria-live="polite"><p class="loading">Loading data…</p></main>

  <div id="tooltip" class="tooltip" role="tooltip"></div>

  <footer class="footer">
    <span>Sources: Eurostat; ILOSTAT. <span id="build-date"></span></span>
    <span>Tony Blair Institute for Global Change · Authors: Gregor Dalheimer (<a href="mailto:gregor.dalheimer@institute.global">gregor.dalheimer@institute.global</a>) and Abaigeal Heneghan (<a href="mailto:abaigeal.heneghan@institute.global">abaigeal.heneghan@institute.global</a>)</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
